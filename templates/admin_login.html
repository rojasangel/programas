{% extends "base.html" %}
{% block title %}Administración | FR BEISSHOP{% endblock %}
{% block content %}
<section class="admin-page section-wrap admin-login">
  <p class="eyebrow eyebrow-dark">FR BEISSHOP / ADMINISTRACIÓN</p>
  <h1>Entrar al panel</h1>
  <p class="admin-intro">Usa tus credenciales para entrar al panel de la tienda.</p>
  <form class="admin-form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Usuario
      <input type="text" name="usuario" autocomplete="username" required autofocus>
    </label>
    <label>Contraseña
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="button button-dark" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
