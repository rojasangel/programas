{% extends "base.html" %}
{% block title %}Nueva contrase&ntilde;a | FR BEISSHOP{% endblock %}
{% block content %}
<section class="admin-page section-wrap auth-page">
  <p class="eyebrow eyebrow-dark">FR BEISSHOP / MI CUENTA</p>
  <h1>Crea una nueva contrase&ntilde;a</h1>
  <form class="admin-form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nueva contrase&ntilde;a <span>Al menos 8 caracteres</span>
      <input type="password" name="password" autocomplete="new-password" minlength="8" required>
    </label>
    <label>Confirmar contrase&ntilde;a
      <input type="password" name="confirmar_password" autocomplete="new-password" minlength="8" required>
    </label>
    <button class="button button-dark" type="submit">Guardar contrase&ntilde;a</button>
  </form>
</section>
{% endblock %}
